name: Build and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pygbag==0.9.2
      - run: python -m pygbag --build .
       - name: Give game package a unique version
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          folder = Path("build/web")
          version = os.environ["BUILD_VERSION"][:12]
          for package in folder.glob("*.apk"):
              old_name = package.name
              new_name = f"{package.stem}-{version}.apk"
              package.rename(folder / new_name)
              for page in folder.glob("*.html"):
                  text = page.read_text(encoding="utf-8")
                  page.write_text(
                      text.replace(old_name, new_name),
                      encoding="utf-8"
                  )
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        id: deployment
